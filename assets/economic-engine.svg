<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="550" viewBox="0 0 1440 550" role="img" aria-labelledby="title desc">
<title id="title">Agentic Income unit economics decision lens</title><desc id="desc">Illustrative unit margin components and decision gates. No financial values or earnings claims are represented.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111B2C"/><stop offset="58%" stop-color="#0A101C"/><stop offset="100%" stop-color="#070B12"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFE1A3"/><stop offset="52%" stop-color="#F5B544"/><stop offset="100%" stop-color="#B97625"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B7F5F8"/><stop offset="100%" stop-color="#3FD0DE"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A2B7CA" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1440" height="550" rx="18" fill="url(#bg)"/><rect width="1440" height="550" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1438" height="548" rx="17" fill="none" stroke="#AEC4D5" stroke-opacity=".15"/>
<text x="48" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5B544" letter-spacing="3">THE ECONOMIC ENGINE</text><text x="48" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#EDF3F8" >Ideas are cheap. Viable economics are not.</text><rect x="48" y="160" width="580" height="298" rx="16" fill="#152237" stroke="#8EAFC3" stroke-opacity=".28"/><text x="80" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F7D189" >UNIT MARGIN  /  DECISION MODEL</text><text x="91" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#DBF5F1" >+  Revenue per transaction</text><text x="91" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#C9D6E6" >−  Less variable delivery cost</text><text x="91" y="346" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#C9D6E6" >−  Less platform / transaction fees</text><text x="91" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#C9D6E6" >−  Less attributable acquisition cost</text><path d="M87 412 L576 412" stroke="#F5B544" opacity="0.65" stroke-width="1.5" fill="none" stroke-linecap="round"/><text x="88" y="439" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5B544" >=  Contribution before fixed costs</text><rect x="680" y="160" width="710" height="298" rx="16" fill="#142132" stroke="#8EAFC3" stroke-opacity=".28"/><text x="718" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F7D189" >THREE GATES BEFORE SCALE</text><circle cx="738" cy="245" r="18" fill="#E9B957" fill-opacity=".12" stroke="#DAB167" stroke-opacity=".52"/><text x="738" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F5B544" text-anchor="middle">01</text><text x="778" y="241" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#E5EDF7" >SOURCE</text><text x="778" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AFBFD0" >Are inputs dated and independently traceable?</text><circle cx="738" cy="313" r="18" fill="#E9B957" fill-opacity=".12" stroke="#DAB167" stroke-opacity=".52"/><text x="738" y="318" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F5B544" text-anchor="middle">02</text><text x="778" y="309" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#E5EDF7" >SENSITIVITY</text><text x="778" y="333" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AFBFD0" >Does the model survive realistic cost changes?</text><circle cx="738" cy="381" r="18" fill="#E9B957" fill-opacity=".12" stroke="#DAB167" stroke-opacity=".52"/><text x="738" y="386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F5B544" text-anchor="middle">03</text><text x="778" y="377" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#E5EDF7" >CONTROL</text><text x="778" y="401" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AFBFD0" >Can an operator stop spending and reverse actions?</text><text x="48" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="2.2">METHOD  /  NOT FINANCIAL ADVICE</text><text x="1392" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="1.5" text-anchor="end">AGENTIC INCOME  /  SYSTEM INTELLIGENCE</text></svg>