<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">Agentic Income evidence discipline</title><desc id="desc">Four-tier evidence and readiness framework separating documented facts, testable capabilities, plans and unsupported claims.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111B2C"/><stop offset="58%" stop-color="#0A101C"/><stop offset="100%" stop-color="#070B12"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFE1A3"/><stop offset="52%" stop-color="#F5B544"/><stop offset="100%" stop-color="#B97625"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B7F5F8"/><stop offset="100%" stop-color="#3FD0DE"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A2B7CA" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1440" height="460" rx="18" fill="url(#bg)"/><rect width="1440" height="460" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="1438" height="458" rx="17" fill="none" stroke="#AEC4D5" stroke-opacity=".15"/>
<text x="48" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5B544" letter-spacing="3">THE EVIDENCE STANDARD</text><text x="48" y="110" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#F2F6FC" >Trust compounds. Hype decays.</text><rect x="48" y="157" width="1344" height="51" rx="9" fill="#182638" stroke="#7A9BAC" stroke-opacity=".30"/><text x="70" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5B544" >01</text><text x="148" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#E8F1FA" >DOCUMENTED</text><text x="850" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEC2D3" >Source, date, owner</text><rect x="48" y="223" width="1344" height="51" rx="9" fill="#182638" stroke="#7A9BAC" stroke-opacity=".30"/><text x="70" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5B544" >02</text><text x="148" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#E8F1FA" >TESTED</text><text x="850" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEC2D3" >Reproducible execution</text><rect x="48" y="289" width="1344" height="51" rx="9" fill="#182638" stroke="#7A9BAC" stroke-opacity=".30"/><text x="70" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5B544" >03</text><text x="148" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#E8F1FA" >PLANNED</text><text x="850" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEC2D3" >Clearly marked roadmap</text><rect x="48" y="355" width="1344" height="51" rx="9" fill="#28212A" stroke="#B66A71" stroke-opacity=".30"/><text x="70" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F5B544" >04</text><text x="148" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#E8F1FA" >UNVERIFIED</text><text x="850" y="388" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#AEC2D3" >Never marketed as fact</text><text x="48" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="2.2">RESEARCH  /  ASSURANCE</text><text x="1392" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="1.5" text-anchor="end">AGENTIC INCOME  /  SYSTEM INTELLIGENCE</text></svg>