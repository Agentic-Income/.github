<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Agentic Income — open systems for agent-built income</title>
  <desc id="desc">Dark banner with a fine data grid, a constellation of connected nodes, and gold and cyan accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="55%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.16" cy="0.08" r="0.62">
      <stop offset="0%" stop-color="#f5b544" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f5b544" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.86" cy="0.86" r="0.58">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#c3cfdf"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b544"/>
      <stop offset="100%" stop-color="#f5b544" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ea3bd" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <rect width="1600" height="400" fill="url(#goldGlow)"/>
  <rect width="1600" height="400" fill="url(#cyanGlow)"/>
  <rect x="20" y="20" width="1560" height="360" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="20" y="20" width="1560" height="1" fill="#f5b544" fill-opacity="0.35"/>

  <g fill="none" stroke-linecap="round">
    <circle cx="1270" cy="205" r="176" stroke="#22d3ee" stroke-opacity="0.10" stroke-dasharray="2 10"/>
    <circle cx="1270" cy="205" r="238" stroke="#f5b544" stroke-opacity="0.07" stroke-dasharray="1 14"/>
  </g>

  <g stroke-linecap="round">
    <g stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.1">
      <path d="M1050 120L1150 88M1150 88L1240 140M1240 140L1330 96M1330 96L1430 150"/>
      <path d="M1050 120L1080 220M1150 88L1190 210M1240 140L1190 210M1240 140L1290 240"/>
      <path d="M1330 96L1290 240M1330 96L1390 220M1430 150L1390 220M1430 150L1480 260"/>
      <path d="M1080 220L1190 210M1190 210L1290 240M1290 240L1390 220M1390 220L1480 260"/>
      <path d="M1080 220L1120 310M1190 210L1120 310M1190 210L1230 300M1290 240L1230 300M1290 240L1340 320"/>
      <path d="M1390 220L1340 320M1390 220L1440 330M1480 260L1440 330M1120 310L1230 300M1230 300L1340 320M1340 320L1440 330"/>
    </g>
    <g stroke="#f5b544" stroke-opacity="0.20" stroke-width="1.1">
      <path d="M1150 88L1240 140M1240 140L1330 96M1080 220L1190 210M1240 140L1290 240M1290 240L1390 220"/>
      <path d="M1190 210L1230 300M1290 240L1340 320M1390 220L1440 330"/>
    </g>
  </g>

  <g>
    <g fill="#0a1220" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2">
      <circle cx="1050" cy="120" r="4.5"/>
      <circle cx="1150" cy="88" r="4"/>
      <circle cx="1240" cy="140" r="6" filter="url(#nodeGlow)"/>
      <circle cx="1330" cy="96" r="4.5"/>
      <circle cx="1430" cy="150" r="4"/>
      <circle cx="1080" cy="220" r="4"/>
      <circle cx="1190" cy="210" r="5.5"/>
      <circle cx="1290" cy="240" r="4"/>
      <circle cx="1390" cy="220" r="5" filter="url(#nodeGlow)"/>
      <circle cx="1480" cy="260" r="4"/>
      <circle cx="1120" cy="310" r="4.5"/>
      <circle cx="1230" cy="300" r="4"/>
      <circle cx="1340" cy="320" r="5.5"/>
      <circle cx="1440" cy="330" r="4"/>
    </g>
    <g fill="#f5b544">
      <circle cx="1240" cy="140" r="2.4"/>
      <circle cx="1390" cy="220" r="2.2"/>
      <circle cx="1340" cy="320" r="2.2"/>
    </g>
  </g>

  <g>
    <rect x="96" y="94" width="8" height="8" rx="1.5" fill="#f5b544"/>
    <text x="120" y="103" font-size="13" font-weight="800" fill="#f5b544" letter-spacing="5">AGENTIC INCOME</text>
    <text x="96" y="186" font-size="54" font-weight="800" fill="url(#ink)" letter-spacing="-0.5">Open systems for</text>
    <text x="96" y="246" font-size="54" font-weight="800" fill="url(#ink)" letter-spacing="-0.5">agent-built income</text>
    <text x="98" y="292" font-size="18" font-weight="500" fill="#9fb0c7">Skills, catalogs, templates, and research with the evidence in view.</text>
    <rect x="96" y="322" width="620" height="1" fill="url(#rule)" fill-opacity="0.8"/>
    <text x="96" y="354" font-size="11" font-weight="700" fill="#7386a0" letter-spacing="2.4">GITHUB.COM/AGENTIC-INCOME</text>
    <text x="1504" y="354" text-anchor="end" font-size="11" font-weight="700" fill="#7386a0" letter-spacing="2.4">OPEN SYSTEMS · EVIDENCE IN VIEW</text>
  </g>
</svg>
