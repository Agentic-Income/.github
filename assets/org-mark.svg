<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Agentic Income mark</title>
  <desc id="desc">A geometric A and I monogram in gold and cyan, drawn as connected evidence nodes on a dark grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b13"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.28" cy="0.16" r="0.7">
      <stop offset="0%" stop-color="#f5b544" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f5b544" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.82" cy="0.86" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f5b544"/>
      <stop offset="100%" stop-color="#c9871f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7deefb"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ea3bd" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#grid)"/>
  <rect width="512" height="512" rx="96" fill="url(#goldGlow)"/>
  <rect width="512" height="512" rx="96" fill="url(#cyanGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="16" y="16" width="480" height="1" fill="#f5b544" fill-opacity="0.45"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 148L150 356M222 148L294 356M176 282H268" stroke="url(#gold)" stroke-width="20"/>
    <path d="M352 148V356M338 148H366M338 356H366" stroke="url(#cyan)" stroke-width="20"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="222" cy="148" r="12" fill="#f5b544"/>
    <circle cx="150" cy="356" r="9" fill="#f5b544"/>
    <circle cx="294" cy="356" r="9" fill="#f5b544"/>
    <circle cx="352" cy="148" r="9" fill="#22d3ee"/>
    <circle cx="352" cy="356" r="9" fill="#22d3ee"/>
  </g>
  <circle cx="222" cy="148" r="4" fill="#05070d"/>

  <text x="256" y="438" text-anchor="middle" font-size="12" font-weight="800" fill="#8ea3bd" letter-spacing="4.5">AGENTIC INCOME</text>
</svg>
