<text x="48" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5B544" letter-spacing="3">THE OPERATING LOOP</text><text x="48" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#EDF3F8" >From signal to sustainable value</text><text x="48" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#AFC2D2" >A decision framework, not a promise of automated earnings.</text><rect x="48" y="193" width="247" height="167" rx="14" fill="#172336" stroke="#65869A" stroke-opacity=".45"/><text x="68" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5B544" >01</text><path d="M68 248 L270 248" stroke="#7494A8" opacity="0.24" stroke-width="1" fill="none" stroke-linecap="round"/><text x="68" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F2F5F8" >RESEARCH</text><text x="68" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AEC3D4" >Problems / evidence</text><path d="M296 278h29l-8 -7m8 7l-8 7" stroke="#F5B544" stroke-opacity=".8" fill="none" stroke-width="2"/><rect x="326" y="193" width="247" height="167" rx="14" fill="#172336" stroke="#65869A" stroke-opacity=".45"/><text x="346" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5B544" >02</text><path d="M346 248 L548 248" stroke="#7494A8" opacity="0.24" stroke-width="1" fill="none" stroke-linecap="round"/><text x="346" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F2F5F8" >MODEL</text><text x="346" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AEC3D4" >Income system design</text><path d="M574 278h29l-8 -7m8 7l-8 7" stroke="#F5B544" stroke-opacity=".8" fill="none" stroke-width="2"/><rect x="604" y="193" width="247" height="167" rx="14" fill="#172336" stroke="#F5B544" stroke-opacity=".45"/><text x="624" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5B544" >03</text><path d="M624 248 L826 248" stroke="#7494A8" opacity="0.24" stroke-width="1" fill="none" stroke-linecap="round"/><text x="624" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F2F5F8" >VERIFY</text><text x="624" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AEC3D4" >Unit economics / risk</text><path d="M852 278h29l-8 -7m8 7l-8 7" stroke="#F5B544" stroke-opacity=".8" fill="none" stroke-width="2"/><rect x="882" y="193" width="247" height="167" rx="14" fill="#172336" stroke="#65869A" stroke-opacity=".45"/><text x="902" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5B544" >04</text><path d="M902 248 L1104 248" stroke="#7494A8" opacity="0.24" stroke-width="1" fill="none" stroke-linecap="round"/><text x="902" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F2F5F8" >BUILD</text><text x="902" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AEC3D4" >Agent workflows</text><path d="M1130 278h29l-8 -7m8 7l-8 7" stroke="#F5B544" stroke-opacity=".8" fill="none" stroke-width="2"/><rect x="1160" y="193" width="247" height="167" rx="14" fill="#172336" stroke="#65869A" stroke-opacity=".45"/><text x="1180" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5B544" >05</text><path d="M1180 248 L1382 248" stroke="#7494A8" opacity="0.24" stroke-width="1" fill="none" stroke-linecap="round"/><text x="1180" y="288" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F2F5F8" >MEASURE</text><text x="1180" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#AEC3D4" >Outcomes / iteration</text><text x="48" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5B544" letter-spacing="2">EVIDENCE IN</text><path d="M210 407 L1210 407" stroke="#F5B544" opacity="0.6" stroke-width="2" fill="none" stroke-linecap="round"/><text x="1390" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F5B544" text-anchor="end" letter-spacing="2">LEARNING OUT</text><text x="48" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="2.2">FRAMEWORK  /  CONCEPTUAL</text><text x="1392" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="1.5" text-anchor="end">AGENTIC INCOME  /  SYSTEM INTELLIGENCE</text></svg>