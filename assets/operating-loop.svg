<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">The Agentic Income operating loop</title><desc id="desc">Five-stage conceptual process from evidence to outcome, showing the intended operating discipline rather than claiming that every stage is automated.</desc>
