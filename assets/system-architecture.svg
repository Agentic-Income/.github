<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
<title id="title">Agentic Income product and trust architecture</title><desc id="desc">Public gateway to capabilities, controlled assets and governance. Distinguishes a documented MCP endpoint and public repositories from a conceptual economic loop.</desc>
