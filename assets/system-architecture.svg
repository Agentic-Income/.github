<text x="48" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5B544" letter-spacing="3">PRODUCT &amp; TRUST ARCHITECTURE</text><text x="48" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#EAF1F8" >A useful system. An inspectable system.</text><rect x="48" y="166" width="404" height="274" rx="15" fill="#192536" stroke="#7C9DB2" stroke-opacity=".5"/><rect x="518" y="166" width="404" height="274" rx="15" fill="#192536" stroke="#7C9DB2" stroke-opacity=".5"/><rect x="988" y="166" width="404" height="274" rx="15" fill="#192536" stroke="#7C9DB2" stroke-opacity=".5"/><text x="82" y="209" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F5B544" letter-spacing="2">DISCOVER</text><text x="82" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#E8EFF5" >Public research &amp; skills</text><text x="82" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Open catalogs</text><text x="82" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Portable skill contracts</text><text x="82" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Evidence and attribution</text><text x="552" y="209" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F5B544" letter-spacing="2">DESIGN</text><text x="552" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#E8EFF5" >MCP &amp; model workbench</text><text x="552" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Income graphs / manifests</text><text x="552" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Economic checks</text><text x="552" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Human-readable outputs</text><text x="1022" y="209" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F5B544" letter-spacing="2">GOVERN</text><text x="1022" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#E8EFF5" >Owner retains control</text><text x="1022" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Source-backed claims</text><text x="1022" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >Independent verification</text><text x="1022" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#B7C9DA" >No autonomous spending</text><path d="M452 284h64l-13 -8m13 8l-13 8M922 284h64l-13 -8m13 8l-13 8" fill="none" stroke="#F5B544" stroke-width="2.5"/><text x="49" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F2CB80" letter-spacing="1.2">SOURCE → CONTRACT → DECISION → AUDIT TRAIL</text><text x="48" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="2.2">ARCHITECTURE  /  CAPABILITY MAP</text><text x="1392" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#8DA0B7" letter-spacing="1.5" text-anchor="end">AGENTIC INCOME  /  SYSTEM INTELLIGENCE</text></svg>